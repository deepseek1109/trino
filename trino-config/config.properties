# Trino server configuration with reverse proxy support
# Single node setup (coordinator + worker)

coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# Enable processing of forwarded headers (X-Forwarded-For, X-Forwarded-Proto, etc.)
# Required when running behind a reverse proxy
http-server.process-forwarded=true

# Catalog management setting
catalog.management=static
